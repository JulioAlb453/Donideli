<div class="min-h-screen bg-white">
  <!-- Hero -->
  <section
    class="bg-secondary-300 px-4 py-16 text-center sm:py-20 md:py-24"
    aria-labelledby="hero-heading"
  >
    <h1
      id="hero-heading"
      class="font-heading text-5xl tracking-tight text-primary-800 sm:text-6xl md:text-7xl"
    >
      DoniDeli
    </h1>
    <p
      class="font-body mt-4 text-lg text-primary-700 sm:text-xl md:text-2xl"
    >
      {{ tagline }}
    </p>
  </section>

  <!-- Categorías -->
  <section
    class="px-4 py-14 sm:py-16 md:py-20"
    aria-labelledby="categories-heading"
  >
    <h2 id="categories-heading" class="sr-only">Categorías</h2>
    <div
      class="mx-auto grid max-w-6xl gap-8 md:grid-cols-3 md:gap-10"
    >
      @for (cat of categories; track cat.title) {
        <article
          class="flex flex-col items-center rounded-2xl bg-white px-6 py-8 text-center shadow-md ring-1 ring-primary-100"
        >
          <div
            class="mb-5 flex h-16 w-16 items-center justify-center"
            aria-hidden="true"
          >
            <app-flaticon-icon
              [name]="cat.flaticonIcon"
              class="h-14 w-14"
            />
          </div>
          <h3
            class="font-heading text-2xl text-primary-800 md:text-3xl"
          >
            {{ cat.title }}
          </h3>
          <p
            class="font-body mt-3 max-w-sm text-sm leading-relaxed text-primary-700 md:text-base"
          >
            {{ cat.description }}
          </p>
          <a
            class="font-heading mt-6 text-primary-700 underline decoration-primary-500 underline-offset-4 transition hover:text-primary-900"
            [href]="cat.menuLink"
          >
            Ver menu
          </a>
        </article>
      }
    </div>
  </section>

  <!-- Promociones -->
  <section
    class="bg-primary-500 px-4 py-14 text-white sm:py-16 md:py-20"
    aria-labelledby="promos-heading"
  >
    <h2
      id="promos-heading"
      class="font-heading text-center text-3xl italic text-white sm:text-4xl"
    >
      Promociones Disponibles
    </h2>

    <div class="mx-auto mt-10 max-w-6xl overflow-hidden">
      <div
        class="promo-track flex w-[300%] transition-transform duration-500 ease-out"
        [style.transform]="
          'translateX(-' + promoSlideIndex() * (100 / 3) + '%)'
        "
      >
        @for (slide of [0, 1, 2]; track slide) {
          <div
            class="grid w-1/3 shrink-0 grid-cols-2 gap-4 md:grid-cols-4 md:gap-5"
            role="group"
            [attr.aria-label]="'Promociones grupo ' + (slide + 1)"
          >
            @for (n of [1, 2, 3, 4]; track n) {
              <div
                class="overflow-hidden rounded-xl bg-white/10 shadow-lg ring-1 ring-white/20"
              >
                <div
                  class="promo-placeholder aspect-[4/3] w-full"
                  role="img"
                  [attr.aria-label]="
                    'Imagen de promoción ' + n + ', pendiente'
                  "
                ></div>
              </div>
            }
          </div>
        }
      </div>
    </div>

    <div
      class="mt-8 flex justify-center gap-2"
      role="tablist"
      aria-label="Paginación de promociones"
    >
      @for (i of [0, 1, 2]; track i) {
        <button
          type="button"
          role="tab"
          class="h-2.5 w-2.5 rounded-full transition focus:outline-none focus-visible:ring-2 focus-visible:ring-accent-300"
          [class.bg-white]="promoSlideIndex() === i"
          [class.bg-white/40]="promoSlideIndex() !== i"
          [attr.aria-selected]="promoSlideIndex() === i"
          [attr.tabindex]="promoSlideIndex() === i ? 0 : -1"
          (click)="setPromoSlide(i)"
          [attr.aria-label]="'Ver promociones página ' + (i + 1)"
        ></button>
      }
    </div>

    <p class="mt-10 text-center">
      <a
        href="#"
        class="font-heading text-lg text-white underline decoration-white/70 underline-offset-4 transition hover:decoration-white"
      >
        Ver Promociones
      </a>
    </p>
  </section>
</div>
