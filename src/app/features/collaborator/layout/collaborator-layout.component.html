<div
  class="admin-layout flex min-h-screen flex-col bg-primary-50 md:flex-row md:items-stretch"
>
  <app-collaborator-sidebar (logoutClick)="logout()" />

  <div class="flex min-h-0 min-w-0 flex-1 flex-col md:flex-row">
    <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-y-auto">
      <router-outlet />
    </div>

    <div
      class="flex min-h-0 w-full shrink-0 flex-col border-t border-primary-200 bg-white md:h-screen md:w-96 md:border-l md:border-t-0 md:bg-transparent"
    >
      <app-admin-chat-panel
        class="flex min-h-[17.5rem] flex-1 flex-col md:h-full md:min-h-0 md:max-h-screen"
        [docked]="true"
      />
    </div>
  </div>
</div>
