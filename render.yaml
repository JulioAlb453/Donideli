services:
  - type: web
    name: donideli
    runtime: node
    region: oregon
    plan: free
    buildCommand: NODE_OPTIONS=--max-old-space-size=460 corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm exec ng build --configuration=production-static
    startCommand: pnpm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
