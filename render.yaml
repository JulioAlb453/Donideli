services:
  - type: web
    name: donideli
    runtime: node
    region: oregon
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=450 pnpm run build:render
    startCommand: pnpm start 
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.0" 
      - key: NODE_ENV
        value: production