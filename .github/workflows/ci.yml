name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar (mismo perfil que Render: estatico + SPA)
        run: NODE_OPTIONS=--max-old-space-size=460 pnpm exec ng build --configuration=production-static

      - name: Pruebas unitarias
        run: pnpm exec ng test --watch=false

  trigger-render-deploy:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Sin RENDER_DEPLOY_HOOK_URL: el deploy lo hace la integración Git de Render si está activada."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
